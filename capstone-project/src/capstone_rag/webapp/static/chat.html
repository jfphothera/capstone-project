<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phothera Bot Ã‚· Capstone simulation</title>
<script src="/static/js/theme.js?v=rc28"></script>
<link rel="stylesheet" href="/static/css/chat.css?v=rc28">
<link rel="stylesheet" href="/static/css/theme.css?v=rc28">
<link rel="stylesheet" href="/static/css/studio.css?v=rc28">
</head>
<body class="chat-page">
<div class="widget">

  <header>
    <div class="who">
      <strong>Phothera Bot</strong>
      <span id="presence" role="status"></span>
    </div>
    <label class="theme-control">Theme <select aria-label="Color theme" data-theme-picker><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <button class="link" id="btn-restart" title="Start a new conversation">
      New conversation
    </button>
  </header>

  <div class="chat-intro"><span>Device support</span><h1>A little help, a clearer next step.</h1><p>Ask a question about your device or tell us what’s happening.</p></div>
  <div class="transcript" id="transcript" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>

  <div class="handoff" id="handoff" hidden></div>

  <form class="composer" id="composer" autocomplete="off">
    <input type="text" id="input" placeholder="Type your message"
           aria-label="Message" maxlength="2000">
    <button type="submit" id="send" aria-label="Send">Send</button>
  </form>

  <footer>
    <span id="resume-note"></span>
    <span class="disclaimer">
      Simulated chatbot
    </span>
  </footer>

</div>
<script type="module" src="/static/js/chat.js?v=rc28"></script>
<script type="module" src="/static/js/global_nav.js?v=rc28"></script></body>
</html>
