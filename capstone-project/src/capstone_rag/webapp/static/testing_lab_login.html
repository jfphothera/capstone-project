<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testing Lab sign-in</title>
<link rel="stylesheet" href="/static/css/app.css?v=rc28"><style>body{display:grid;place-items:center;min-height:100vh}.login{padding:32px;max-width:440px}input,button{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:12px}</style></head>
<body><form class="login"><h1>Testing Lab sign-in</h1><p>Enter your developer credential to configure and run synthetic experiments. Read-only viewer credentials cannot open this workspace.</p><p>An actively open Testing Lab renews its session automatically. Closing the browser or restarting Capstone may require another sign-in.</p><label>Developer credential<input type="password" id="token" autocomplete="current-password" required></label><button type="submit">Open Testing Lab</button><p role="alert" id="error"></p></form>
<script>document.querySelector('form').onsubmit=async event=>{event.preventDefault();const response=await fetch('/api/developer/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('#token').value})});const next=new URLSearchParams(location.search).get('next');if(response.ok)location.replace(next&&next.startsWith('/')?next:'/pressure-testing');else document.querySelector('#error').textContent='Sign-in failed. Check the developer credential.'};</script><script type="module" src="/static/js/global_nav.js?v=rc28"></script></body></html>
